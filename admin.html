<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | Duck Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; background-color: #0c0f17; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="loginCard" class="w-full max-w-md bg-[#141722] border border-gray-800 p-6 rounded-3xl shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-amber-500 text-black text-2xl flex items-center justify-center mx-auto mb-3">🦆</div>
            <h1 class="text-lg font-black text-white">ورود به مدیریت</h1>
            <p class="text-xs text-gray-400 mt-1">مدیریت قیمت‌ها، بنرها و تب‌ها</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="adminPass" placeholder="رمز عبور..." class="w-full bg-[#0d1017] border border-gray-700 rounded-xl px-4 py-3 text-sm text-center text-white focus:outline-none focus:border-amber-500">
            <button onclick="login()" id="loginBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-black text-xs rounded-xl transition">ورود</button>
        </div>
    </div>

    <div id="dashboardCard" class="hidden w-full max-w-xl bg-[#141722] border border-gray-800 p-6 rounded-3xl shadow-2xl space-y-5">
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <h2 class="text-sm font-black text-white">تنظیمات و امکانات فروشگاه</h2>
            </div>
            <button onclick="logout()" class="text-xs text-rose-400 hover:underline">خروج</button>
        </div>

        <!-- 🔘 مدیریت فعال/غیرفعال بودن تب‌ها -->
        <div class="bg-[#10131d] p-4 rounded-2xl border border-purple-500/20 space-y-2.5">
            <h3 class="text-xs font-black text-purple-400 flex items-center gap-1.5 mb-2">
                <i class="fa-solid fa-toggle-on"></i> وضعیت موجودی تب‌های فروشگاه
            </h3>
            <div class="grid grid-cols-3 gap-2 text-xs">
                <label class="flex items-center gap-2 bg-[#171b26] p-2.5 rounded-xl border border-gray-700/60 cursor-pointer">
                    <input type="checkbox" id="tabGiftsActive" class="w-4 h-4 rounded text-amber-500">
                    <span class="font-bold">اجاره گیفت</span>
                </label>
                <label class="flex items-center gap-2 bg-[#171b26] p-2.5 rounded-xl border border-gray-700/60 cursor-pointer">
                    <input type="checkbox" id="tabStarsActive" class="w-4 h-4 rounded text-amber-500">
                    <span class="font-bold">استارز</span>
                </label>
                <label class="flex items-center gap-2 bg-[#171b26] p-2.5 rounded-xl border border-gray-700/60 cursor-pointer">
                    <input type="checkbox" id="tabPremiumActive" class="w-4 h-4 rounded text-amber-500">
                    <span class="font-bold">پرمیوم</span>
                </label>
            </div>
        </div>

        <!-- بنر -->
        <div class="bg-[#10131d] p-4 rounded-2xl border border-amber-500/20 space-y-2">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-black text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-bullhorn"></i> بنر مناسبتی
                </h3>
                <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
                    <input type="checkbox" id="announcementActive" class="w-4 h-4 rounded text-amber-500">
                    <span>نمایش بنر</span>
                </label>
            </div>
            <input type="text" id="announcementText" placeholder="متن بنر..." class="w-full bg-[#161a26] border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
        </div>

        <!-- کد تخفیف -->
        <div class="bg-[#10131d] p-4 rounded-2xl border border-blue-500/20 space-y-2">
            <h3 class="text-xs font-black text-blue-400 flex items-center gap-1.5">
                <i class="fa-solid fa-ticket"></i> کد تخفیف
            </h3>
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">کد کوپن:</label>
                    <input type="text" id="couponCode" class="w-full bg-[#161a26] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-center uppercase">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">درصد تخفیف (%):</label>
                    <input type="number" id="couponPercent" class="w-full bg-[#161a26] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-center">
                </div>
            </div>
        </div>

        <!-- قیمت‌ها -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
                <label class="block text-gray-400 font-bold mb-1">نرخ هر دانه استارز (تومان):</label>
                <input type="number" id="ratePerStar" class="w-full bg-[#0d1017] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold">
            </div>
            <div>
                <label class="block text-gray-400 font-bold mb-1">اجاره ماهانه گیفت (تومان):</label>
                <input type="number" id="giftMonthlyPrice" class="w-full bg-[#0d1017] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold">
            </div>
        </div>

        <div class="border-t border-gray-800 pt-3">
            <h3 class="text-xs font-black text-purple-400 mb-2">اشتراک‌های پرمیوم (تومان):</h3>
            <div class="grid grid-cols-3 gap-2 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1">۳ ماهه:</label>
                    <input type="number" id="prem3" class="w-full bg-[#0d1017] border border-gray-700 rounded-xl p-2 text-center text-white font-bold">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">۶ ماهه:</label>
                    <input type="number" id="prem6" class="w-full bg-[#0d1017] border border-gray-700 rounded-xl p-2 text-center text-white font-bold">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">۱۲ ماهه:</label>
                    <input type="number" id="prem12" class="w-full bg-[#0d1017] border border-gray-700 rounded-xl p-2 text-center text-white font-bold">
                </div>
            </div>
        </div>

        <div>
            <label class="block text-gray-400 font-bold mb-1 text-xs">آیدی تلگرام دریافت سفارش (بدون @):</label>
            <input type="text" id="adminTg" class="w-full bg-[#0d1017] border border-gray-700 rounded-xl px-3 py-2 text-white font-bold text-left dir-ltr text-xs">
        </div>

        <button onclick="saveSettings()" id="saveBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>ذخیره فوری در دیتابیس</span>
        </button>
    </div>

    <script>
        const WORKER_URL = "https://duck-api.ali-zanjani2007.workers.dev";
        let authToken = sessionStorage.getItem("duck_admin_token");
        if (authToken) showDashboard();

        async function login() {
            const pass = document.getElementById("adminPass").value.trim();
            if (!pass) return alert("لطفاً رمز را وارد کنید");
            const btn = document.getElementById("loginBtn");
            btn.innerText = "در حال ورود...";
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    sessionStorage.setItem("duck_admin_token", authToken);
                    showDashboard();
                } else {
                    alert(data.error || "رمز اشتباه است");
                }
            } catch {
                alert("خطا در اتصال به سرور کلادفلر");
            } finally {
                btn.innerText = "ورود";
            }
        }

        async function showDashboard() {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("dashboardCard").classList.remove("hidden");
            try {
                const res = await fetch(`${WORKER_URL}/api/settings`);
                const s = await res.json();
                document.getElementById("ratePerStar").value = s.ratePerStar || 1450;
                document.getElementById("giftMonthlyPrice").value = s.giftMonthlyPrice || 160000;
                document.getElementById("prem3").value = s.prem3 || 620000;
                document.getElementById("prem6").value = s.prem6 || 950000;
                document.getElementById("prem12").value = s.prem12 || 1690000;
                document.getElementById("adminTg").value = s.adminTg || "Zanjani_a";
                document.getElementById("announcementText").value = s.announcementText || "";
                document.getElementById("announcementActive").checked = s.announcementActive !== false;
                document.getElementById("couponCode").value = s.couponCode || "DUCK";
                document.getElementById("couponPercent").value = s.couponPercent || 10;
                // تیک وضعیت تب‌ها
                document.getElementById("tabGiftsActive").checked = s.tabGiftsActive !== false;
                document.getElementById("tabStarsActive").checked = s.tabStarsActive !== false;
                document.getElementById("tabPremiumActive").checked = s.tabPremiumActive !== false;
            } catch(e) {}
        }

        async function saveSettings() {
            const saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> در حال ذخیره...';
            const payload = {
                ratePerStar: parseInt(document.getElementById("ratePerStar").value),
                giftMonthlyPrice: parseInt(document.getElementById("giftMonthlyPrice").value),
                prem3: parseInt(document.getElementById("prem3").value),
                prem6: parseInt(document.getElementById("prem6").value),
                prem12: parseInt(document.getElementById("prem12").value),
                adminTg: document.getElementById("adminTg").value.trim().replace("@", ""),
                announcementText: document.getElementById("announcementText").value.trim(),
                announcementActive: document.getElementById("announcementActive").checked,
                couponCode: document.getElementById("couponCode").value.trim().toUpperCase(),
                couponPercent: parseInt(document.getElementById("couponPercent").value) || 0,
                // ارسال وضعیت تب‌ها
                tabGiftsActive: document.getElementById("tabGiftsActive").checked,
                tabStarsActive: document.getElementById("tabStarsActive").checked,
                tabPremiumActive: document.getElementById("tabPremiumActive").checked
            };
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/settings`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) alert("✅ تنظیمات، قیمت‌ها و وضعیت تب‌ها با موفقیت ذخیره شدند!");
                else { alert("نشست شما منقضی شده است."); logout(); }
            } catch {
                alert("خطا در ارسال داده‌ها");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> <span>ذخیره فوری در دیتابیس</span>';
            }
        }

        function logout() {
            sessionStorage.removeItem("duck_admin_token");
            location.reload();
        }
    </script>
</body>
</html>
