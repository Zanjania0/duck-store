<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پنل مدیریت جامع Duck Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #08090e; color: #f3f4f6; }
        .admin-card { background: #10121a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; }
        .input-dark { background: #090a0f; border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }
        .input-dark:focus { outline: none; border-color: #f59e0b; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-8">

    <!-- فرم لاگین -->
    <div id="loginCard" class="admin-card w-full max-w-md p-6 space-y-5">
        <div class="text-center space-y-1">
            <div class="w-14 h-14 rounded-2xl bg-amber-400 text-black flex items-center justify-center text-2xl font-black mx-auto">🦆</div>
            <h1 class="text-base font-black text-white pt-2">ورود به مدیریت Duck Store</h1>
            <p class="text-xs text-gray-400">رمز عبور خود را وارد کنید</p>
        </div>
        <div class="space-y-3">
            <input type="password" id="adminPass" placeholder="رمز عبور..." class="input-dark w-full rounded-xl px-4 py-3 text-center text-sm font-bold">
            <button onclick="login()" id="loginBtn" class="w-full py-3 bg-amber-400 text-black font-black text-xs rounded-xl shadow-lg shadow-amber-400/20">ورود</button>
        </div>
    </div>

    <!-- داشبورد اصلی -->
    <div id="dashboardCard" class="hidden admin-card w-full max-w-2xl p-6 space-y-6">
        <div class="flex items-center justify-between border-b border-white/5 pb-4">
            <h2 class="text-sm font-black text-white flex items-center gap-2">
                <span>مدیریت پیشرفته خدمات</span>
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            </h2>
            <div class="flex items-center gap-2">
                <a href="index.html" target="_blank" class="px-3 py-1.5 rounded-xl bg-white/5 text-gray-300 text-xs font-bold">مشاهده سایت</a>
                <button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-bold">خروج</button>
            </div>
        </div>

        <!-- تب‌های کنترل پنل ادمین -->
        <div class="flex items-center gap-2 border-b border-white/5 pb-3 overflow-x-auto">
            <button onclick="switchAdminTab('prices')" id="atab-prices" class="px-4 py-2 rounded-xl text-xs font-black bg-amber-400 text-black">تعرفه‌های پایه</button>
            <button onclick="switchAdminTab('custom')" id="atab-custom" class="px-4 py-2 rounded-xl text-xs font-bold bg-[#161926] text-gray-300">مدیریت خدمات سفارشی (بوست، اکانت، ممبر)</button>
            <button onclick="switchAdminTab('marketing')" id="atab-marketing" class="px-4 py-2 rounded-xl text-xs font-bold bg-[#161926] text-gray-300">بنر و کد تخفیف</button>
        </div>

        <!-- بخش اول: تعرفه‌های پایه -->
        <div id="asec-prices" class="space-y-4">
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-bold">نرخ هر ۱ استارز (تومان):</label>
                    <input type="number" id="ratePerStar" class="input-dark w-full rounded-xl p-2.5 font-bold">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-bold">اجاره ماهانه هر گیفت (تومان):</label>
                    <input type="number" id="giftMonthlyPrice" class="input-dark w-full rounded-xl p-2.5 font-bold">
                </div>
            </div>

            <div class="border-t border-white/5 pt-3">
                <label class="block text-gray-400 mb-2 font-bold text-xs">قیمت‌های تلگرام پرمیوم (تومان):</label>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <div>
                        <span class="block text-gray-400 text-[11px] mb-1">۳ ماهه:</span>
                        <input type="number" id="prem3" class="input-dark w-full rounded-xl p-2 font-bold text-center">
                    </div>
                    <div>
                        <span class="block text-gray-400 text-[11px] mb-1">۶ ماهه:</span>
                        <input type="number" id="prem6" class="input-dark w-full rounded-xl p-2 font-bold text-center">
                    </div>
                    <div>
                        <span class="block text-gray-400 text-[11px] mb-1">۱۲ ماهه:</span>
                        <input type="number" id="prem12" class="input-dark w-full rounded-xl p-2 font-bold text-center">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-gray-400 mb-1 font-bold text-xs">آیدی تلگرام پشتیبانی (بدون @):</label>
                <input type="text" id="adminTg" class="input-dark w-full rounded-xl p-2.5 text-xs font-bold dir-ltr text-left">
            </div>
        </div>

        <!-- بخش دوم: خدمات سفارشی (افزودن بوست، اکانت و ممبر با دلخواه خودتان) -->
        <div id="asec-custom" class="hidden space-y-4">
            <div class="p-4 rounded-2xl bg-[#090a0f] border border-white/5 space-y-3">
                <h4 class="text-xs font-black text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>افزودن محصول / پلن جدید به فروشگاه</span>
                </h4>
                <div class="grid grid-cols-2 gap-2.5 text-xs">
                    <div>
                        <label class="block text-gray-400 mb-1">دسته‌بندی:</label>
                        <select id="newCat" class="input-dark w-full rounded-xl p-2 text-xs font-bold">
                            <option value="boost">بوست کانال (Boost)</option>
                            <option value="account">اکانت مجازی (Account)</option>
                            <option value="channel">خدمات کانال / ممبر (Channel)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">عنوان محصول (مثلاً: بوست ۷ روزه لول ۴):</label>
                        <input type="text" id="newTitle" placeholder="عنوان محصول..." class="input-dark w-full rounded-xl p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">قیمت به تومان:</label>
                        <input type="number" id="newPrice" placeholder="مثلاً: 50000" class="input-dark w-full rounded-xl p-2 text-xs font-bold">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1">توضیح کوتاه:</label>
                        <input type="text" id="newDesc" placeholder="مثلاً: تحویل فوری با لینک" class="input-dark w-full rounded-xl p-2 text-xs">
                    </div>
                </div>
                <button onclick="addNewCustomService()" class="w-full py-2.5 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded-xl transition">
                    + ثبت این محصول در لیست
                </button>
            </div>

            <div class="space-y-2">
                <h4 class="text-xs font-bold text-gray-300">محصولات ثبت‌شده فعال:</h4>
                <div id="customListAdmin" class="space-y-2 max-h-56 overflow-y-auto"></div>
            </div>
        </div>

        <!-- بخش سوم: بنر و کد تخفیف -->
        <div id="asec-marketing" class="hidden space-y-4">
            <div class="p-3.5 rounded-2xl bg-[#090a0f] border border-white/5 space-y-2">
                <div class="flex items-center justify-between text-xs">
                    <span class="font-bold text-gray-200">بنر اطلاعیه بالای سایت:</span>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="announcementActive" class="w-4 h-4 rounded text-amber-400">
                        <span class="text-amber-400 font-bold text-[11px]">فعال باشد</span>
                    </label>
                </div>
                <input type="text" id="announcementText" placeholder="متن بنر..." class="input-dark w-full rounded-xl p-2 text-xs">
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-gray-400 mb-1 font-bold">کد کوپن:</label>
                    <input type="text" id="couponCode" placeholder="DUCK" class="input-dark w-full rounded-xl p-2.5 text-center font-black uppercase">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-bold">درصد تخفیف (%):</label>
                    <input type="number" id="couponPercent" placeholder="10" class="input-dark w-full rounded-xl p-2.5 text-center font-black">
                </div>
            </div>
        </div>

        <!-- دکمه ذخیره کلی -->
        <button onclick="saveAllSettings()" id="saveBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-black font-black text-xs rounded-2xl shadow-xl shadow-amber-400/25 flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>ذخیره آنی تمام تنظیمات و محصولات در دیتابیس ابری</span>
        </button>
    </div>

    <script>
        const WORKER_URL = "https://duck-api.ali-zanjani2007.workers.dev";
        let authToken = sessionStorage.getItem("duck_admin_token");
        let activeAdminCustomServices = [];

        if (authToken) showDashboard();

        function switchAdminTab(t) {
            ['prices', 'custom', 'marketing'].forEach(tab => {
                document.getElementById(`asec-${tab}`).classList.add('hidden');
                document.getElementById(`atab-${tab}`).classList.remove('bg-amber-400', 'text-black', 'font-black');
                document.getElementById(`atab-${tab}`).classList.add('bg-[#161926]', 'text-gray-300', 'font-bold');
            });
            document.getElementById(`asec-${t}`).classList.remove('hidden');
            document.getElementById(`atab-${t}`).classList.add('bg-amber-400', 'text-black', 'font-black');
            document.getElementById(`atab-${t}`).classList.remove('bg-[#161926]', 'text-gray-300');
        }

        async function login() {
            const pass = document.getElementById("adminPass").value.trim();
            if (!pass) return alert("رمز را وارد کنید");
            const btn = document.getElementById("loginBtn");
            btn.innerText = "در حال ورود...";

            try {
                const res = await fetch(`${WORKER_URL}/api/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    sessionStorage.setItem("duck_admin_token", authToken);
                    showDashboard();
                } else {
                    alert(data.error || "رمز اشتباه است");
                }
            } catch(e) {
                alert("خطا در شبکه");
            } finally {
                btn.innerText = "ورود";
            }
        }

        async function showDashboard() {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("dashboardCard").classList.remove("hidden");

            try {
                const res = await fetch(`${WORKER_URL}/api/settings`);
                if (res.ok) {
                    const s = await res.json();
                    document.getElementById("ratePerStar").value = s.ratePerStar || 1450;
                    document.getElementById("giftMonthlyPrice").value = s.giftMonthlyPrice || 160000;
                    document.getElementById("prem3").value = s.prem3 || 620000;
                    document.getElementById("prem6").value = s.prem6 || 950000;
                    document.getElementById("prem12").value = s.prem12 || 1690000;
                    document.getElementById("adminTg").value = s.adminTg || "Zanjani_a";
                    document.getElementById("announcementText").value = s.announcementText || "";
                    document.getElementById("announcementActive").checked = s.announcementActive !== false;
                    document.getElementById("couponCode").value = s.couponCode || "DUCK";
                    document.getElementById("couponPercent").value = s.couponPercent || 10;
                    activeAdminCustomServices = s.customServices || [];
                    renderAdminCustomList();
                }
            } catch(e) {}
        }

        function renderAdminCustomList() {
            const container = document.getElementById("customListAdmin");
            if (activeAdminCustomServices.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-500 py-3 text-center">محصولی وجود ندارد.</p>';
                return;
            }

            container.innerHTML = activeAdminCustomServices.map((item, idx) => `
                <div class="p-2.5 rounded-xl bg-[#090a0f] border border-white/5 flex items-center justify-between text-xs">
                    <div>
                        <span class="font-bold text-white">${item.title}</span>
                        <span class="text-[10px] text-amber-400 mr-2 font-bold">${Number(item.price).toLocaleString('en-US')} تومان</span>
                        <span class="text-[10px] text-gray-500 bg-white/5 px-2 py-0.5 rounded mr-1">${item.category}</span>
                    </div>
                    <button onclick="removeAdminCustomService(${idx})" class="text-rose-400 hover:text-rose-300 text-xs px-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function addNewCustomService() {
            const cat = document.getElementById("newCat").value;
            const title = document.getElementById("newTitle").value.trim();
            const price = parseInt(document.getElementById("newPrice").value);
            const desc = document.getElementById("newDesc").value.trim();

            if (!title || !price) return alert("عنوان و قیمت الزامی است");

            activeAdminCustomServices.push({
                id: "item-" + Date.now(),
                category: cat,
                title: title,
                price: price,
                desc: desc
            });

            document.getElementById("newTitle").value = "";
            document.getElementById("newPrice").value = "";
            document.getElementById("newDesc").value = "";

            renderAdminCustomList();
        }

        function removeAdminCustomService(idx) {
            activeAdminCustomServices.splice(idx, 1);
            renderAdminCustomList();
        }

        async function saveAllSettings() {
            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> در حال ذخیره...';

            const payload = {
                ratePerStar: parseInt(document.getElementById("ratePerStar").value) || 1450,
                giftMonthlyPrice: parseInt(document.getElementById("giftMonthlyPrice").value) || 160000,
                prem3: parseInt(document.getElementById("prem3").value) || 620000,
                prem6: parseInt(document.getElementById("prem6").value) || 950000,
                prem12: parseInt(document.getElementById("prem12").value) || 1690000,
                adminTg: document.getElementById("adminTg").value.trim().replace("@", "") || "Zanjani_a",
                announcementText: document.getElementById("announcementText").value.trim(),
                announcementActive: document.getElementById("announcementActive").checked,
                couponCode: document.getElementById("couponCode").value.trim().toUpperCase() || "DUCK",
                couponPercent: parseInt(document.getElementById("couponPercent").value) || 0,
                customServices: activeAdminCustomServices
            };

            try {
                const res = await fetch(`${WORKER_URL}/api/admin/settings`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert("✅ تمامی تغییرات، قیمت‌ها و محصولات جدید با موفقیت ذخیره شدند!");
                } else {
                    alert("نشست منقضی شده است.");
                    logout();
                }
            } catch(e) {
                alert("خطا در ارسال اطلاعات");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> <span>ذخیره آنی تمام تنظیمات و محصولات در دیتابیس ابری</span>';
            }
        }

        function logout() {
            sessionStorage.removeItem("duck_admin_token");
            location.reload();
        }
    </script>
</body>
</html>
