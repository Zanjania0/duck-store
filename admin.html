<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت Pearl Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #e9edf3; color: #1e293b; }
        .neo-card { background: #ffffff; border-radius: 26px; box-shadow: 0 10px 30px -5px rgba(148, 163, 184, 0.25); border: 1px solid rgba(255, 255, 255, 0.8); }
        .input-soft { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 16px; color: #0f172a; }
        .input-soft:focus { outline: none; border-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-8">

    <!-- فرم لاگین -->
    <div id="loginCard" class="neo-card w-full max-w-md p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-[22px] bg-[#181d28] text-white flex items-center justify-center text-3xl mx-auto shadow-md">🦆</div>
            <h1 class="text-base font-black text-slate-900">پنل مدیریت Pearl Store</h1>
            <p class="text-xs text-slate-500">برای ورود رمز عبور خود را وارد کنید</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="adminPass" placeholder="رمز عبور..." class="input-soft w-full px-4 py-3.5 text-center text-sm font-bold">
            <button onclick="login()" id="loginBtn" class="w-full py-3.5 bg-[#181d28] hover:bg-black text-white font-black text-xs rounded-2xl transition shadow-md">ورود به مدیریت</button>
        </div>
    </div>

    <!-- داشبورد اصلی -->
    <div id="dashboardCard" class="hidden neo-card w-full max-w-2xl p-6 sm:p-8 space-y-6">
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <h2 class="text-sm font-black text-slate-900 flex items-center gap-2">
                <span>مدیریت محصولات و تعرفه‌ها</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            </h2>
            <div class="flex items-center gap-2">
                <a href="index.html" target="_blank" class="px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200 transition">مشاهده سایت</a>
                <button onclick="logout()" class="px-3.5 py-1.5 rounded-xl bg-rose-50 text-rose-600 text-xs font-bold hover:bg-rose-100 transition">خروج</button>
            </div>
        </div>

        <!-- منوی تب‌های پنل -->
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3 overflow-x-auto">
            <button onclick="switchAdminTab('prices')" id="atab-prices" class="px-4 py-2 rounded-xl text-xs font-black bg-[#181d28] text-white">تعرفه‌های پایه</button>
            <button onclick="switchAdminTab('custom')" id="atab-custom" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">افزودن خدمات جدید (بوست، اکانت، ممبر)</button>
            <button onclick="switchAdminTab('marketing')" id="atab-marketing" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">بنر و تخفیف</button>
        </div>

        <!-- بخش تعرفه‌ها -->
        <div id="asec-prices" class="space-y-4">
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-slate-600 mb-1 font-bold">نرخ هر ۱ استارز (تومان):</label>
                    <input type="number" id="ratePerStar" class="input-soft w-full p-2.5 font-bold">
                </div>
                <div>
                    <label class="block text-slate-600 mb-1 font-bold">اجاره ماهانه گیفت (تومان):</label>
                    <input type="number" id="giftMonthlyPrice" class="input-soft w-full p-2.5 font-bold">
                </div>
            </div>

            <div class="pt-3 border-t border-slate-100">
                <label class="block text-slate-700 mb-2 font-bold text-xs">قیمت‌های تلگرام پرمیوم (تومان):</label>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <div>
                        <span class="block text-slate-500 text-[11px] mb-1">۳ ماهه</span>
                        <input type="number" id="prem3" class="input-soft w-full p-2 font-bold text-center">
                    </div>
                    <div>
                        <span class="block text-slate-500 text-[11px] mb-1">۶ ماهه</span>
                        <input type="number" id="prem6" class="input-soft w-full p-2 font-bold text-center">
                    </div>
                    <div>
                        <span class="block text-slate-500 text-[11px] mb-1">۱۲ ماهه</span>
                        <input type="number" id="prem12" class="input-soft w-full p-2 font-bold text-center">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-slate-600 mb-1 font-bold text-xs">آیدی تلگرام پشتیبانی (بدون @):</label>
                <input type="text" id="adminTg" class="input-soft w-full p-2.5 text-xs font-bold dir-ltr text-left">
            </div>
        </div>

        <!-- بخش افزودن خدمات دلخواه (بوست، اکانت، کانال) -->
        <div id="asec-custom" class="hidden space-y-4">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                <h4 class="text-xs font-black text-slate-900 flex items-center gap-1.5">
                    <i class="fa-solid fa-plus-circle text-slate-700"></i>
                    <span>افزودن پلن جدید (بوست، اکانت یا کانال)</span>
                </h4>
                <div class="grid grid-cols-2 gap-2.5 text-xs">
                    <div>
                        <label class="block text-slate-600 mb-1">دسته‌بندی:</label>
                        <select id="newCat" class="input-soft w-full p-2 text-xs font-bold">
                            <option value="boost">بوست کانال (Boost)</option>
                            <option value="account">اکانت مجازی (Account)</option>
                            <option value="channel">خدمات کانال / ممبر (Channel)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1">عنوان (مثلاً: بوست ۷ روزه لول ۲):</label>
                        <input type="text" id="newTitle" placeholder="نام سرویس..." class="input-soft w-full p-2 text-xs">
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1">قیمت به تومان:</label>
                        <input type="number" id="newPrice" placeholder="50000" class="input-soft w-full p-2 text-xs font-bold">
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1">توضیح کوتاه:</label>
                        <input type="text" id="newDesc" placeholder="توضیحات کوتاه..." class="input-soft w-full p-2 text-xs">
                    </div>
                </div>
                <button onclick="addNewCustomService()" class="w-full py-2.5 bg-[#181d28] hover:bg-black text-white font-bold text-xs rounded-xl transition">
                    + اضافه کردن به لیست
                </button>
            </div>

            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-700">پلن‌های فعال فعلی:</h4>
                <div id="customListAdmin" class="space-y-2 max-h-56 overflow-y-auto"></div>
            </div>
        </div>

        <!-- بخش بنر و کد تخفیف -->
        <div id="asec-marketing" class="hidden space-y-4">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                <div class="flex items-center justify-between text-xs">
                    <span class="font-bold text-slate-800">بنر اطلاعیه بالای سایت:</span>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="announcementActive" class="w-4 h-4 rounded text-slate-800">
                        <span class="text-slate-800 font-bold text-[11px]">فعال باشد</span>
                    </label>
                </div>
                <input type="text" id="announcementText" placeholder="متن بنر..." class="input-soft w-full p-2.5 text-xs">
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="block text-slate-600 mb-1 font-bold">کد کوپن تخفیف:</label>
                    <input type="text" id="couponCode" placeholder="PEARL" class="input-soft w-full p-2.5 text-center font-black uppercase">
                </div>
                <div>
                    <label class="block text-slate-600 mb-1 font-bold">درصد تخفیف (%):</label>
                    <input type="number" id="couponPercent" placeholder="10" class="input-soft w-full p-2.5 text-center font-black">
                </div>
            </div>
        </div>

        <!-- دکمه ذخیره نهایی -->
        <button onclick="saveAllSettings()" id="saveBtn" class="w-full py-3.5 bg-[#181d28] hover:bg-black text-white font-black text-xs rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>ذخیره نهایی در دیتابیس ابری</span>
        </button>
    </div>

    <script>
        const WORKER_URL = "https://duck-api.ali-zanjani2007.workers.dev";
        let authToken = sessionStorage.getItem("duck_admin_token");
        let activeAdminCustomServices = [];

        if (authToken) showDashboard();

        function switchAdminTab(t) {
            ['prices', 'custom', 'marketing'].forEach(tab => {
                document.getElementById(`asec-${tab}`).classList.add('hidden');
                document.getElementById(`atab-${tab}`).classList.remove('bg-[#181d28]', 'text-white');
                document.getElementById(`atab-${tab}`).classList.add('bg-slate-100', 'text-slate-600');
            });
            document.getElementById(`asec-${t}`).classList.remove('hidden');
            document.getElementById(`atab-${t}`).classList.add('bg-[#181d28]', 'text-white');
            document.getElementById(`atab-${t}`).classList.remove('bg-slate-100', 'text-slate-600');
        }

        async function login() {
            const pass = document.getElementById("adminPass").value.trim();
            if (!pass) return alert("رمز را وارد کنید");
            const btn = document.getElementById("loginBtn");
            btn.innerText = "در حال بررسی...";

            try {
                const res = await fetch(`${WORKER_URL}/api/admin/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    sessionStorage.setItem("duck_admin_token", authToken);
                    showDashboard();
                } else {
                    alert(data.error || "رمز اشتباه است");
                }
            } catch(e) {
                alert("خطا در شبکه");
            } finally {
                btn.innerText = "ورود به مدیریت";
            }
        }

        async function showDashboard() {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("dashboardCard").classList.remove("hidden");

            try {
                const res = await fetch(`${WORKER_URL}/api/settings`);
                if (res.ok) {
                    const s = await res.json();
                    document.getElementById("ratePerStar").value = s.ratePerStar || 1450;
                    document.getElementById("giftMonthlyPrice").value = s.giftMonthlyPrice || 160000;
                    document.getElementById("prem3").value = s.prem3 || 620000;
                    document.getElementById("prem6").value = s.prem6 || 950000;
                    document.getElementById("prem12").value = s.prem12 || 1690000;
                    document.getElementById("adminTg").value = s.adminTg || "Zanjani_a";
                    document.getElementById("announcementText").value = s.announcementText || "";
                    document.getElementById("announcementActive").checked = s.announcementActive !== false;
                    document.getElementById("couponCode").value = s.couponCode || "PEARL";
                    document.getElementById("couponPercent").value = s.couponPercent || 10;
                    activeAdminCustomServices = s.customServices || [];
                    renderAdminCustomList();
                }
            } catch(e) {}
        }

        function renderAdminCustomList() {
            const container = document.getElementById("customListAdmin");
            if (activeAdminCustomServices.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 py-3 text-center">محصول سفارشی ثبت نشده است.</p>';
                return;
            }

            container.innerHTML = activeAdminCustomServices.map((item, idx) => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                    <div>
                        <span class="font-bold text-slate-800">${item.title}</span>
                        <span class="text-[11px] text-slate-900 mr-2 font-black">${Number(item.price).toLocaleString('en-US')} تومان</span>
                        <span class="text-[10px] text-slate-500 bg-slate-200 px-2 py-0.5 rounded mr-1">${item.category}</span>
                    </div>
                    <button onclick="removeAdminCustomService(${idx})" class="text-rose-500 hover:text-rose-700 text-xs px-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function addNewCustomService() {
            const cat = document.getElementById("newCat").value;
            const title = document.getElementById("newTitle").value.trim();
            const price = parseInt(document.getElementById("newPrice").value);
            const desc = document.getElementById("newDesc").value.trim();

            if (!title || !price) return alert("عنوان و قیمت الزامی است");

            activeAdminCustomServices.push({
                id: "item-" + Date.now(),
                category: cat,
                title: title,
                price: price,
                desc: desc
            });

            document.getElementById("newTitle").value = "";
            document.getElementById("newPrice").value = "";
            document.getElementById("newDesc").value = "";
            renderAdminCustomList();
        }

        function removeAdminCustomService(idx) {
            activeAdminCustomServices.splice(idx, 1);
            renderAdminCustomList();
        }

        async function saveAllSettings() {
            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> در حال ذخیره...';

            const payload = {
                ratePerStar: parseInt(document.getElementById("ratePerStar").value) || 1450,
                giftMonthlyPrice: parseInt(document.getElementById("giftMonthlyPrice").value) || 160000,
                prem3: parseInt(document.getElementById("prem3").value) || 620000,
                prem6: parseInt(document.getElementById("prem6").value) || 950000,
                prem12: parseInt(document.getElementById("prem12").value) || 1690000,
                adminTg: document.getElementById("adminTg").value.trim().replace("@", "") || "Zanjani_a",
                announcementText: document.getElementById("announcementText").value.trim(),
                announcementActive: document.getElementById("announcementActive").checked,
                couponCode: document.getElementById("couponCode").value.trim().toUpperCase() || "PEARL",
                couponPercent: parseInt(document.getElementById("couponPercent").value) || 0,
                customServices: activeAdminCustomServices
            };

            try {
                const res = await fetch(`${WORKER_URL}/api/admin/settings`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert("✅ تنظیمات و محصولات جدید با موفقیت ذخیره شدند!");
                } else {
                    alert("نشست منقضی شده است.");
                    logout();
                }
            } catch(e) {
                alert("خطا در ارسال اطلاعات");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> <span>ذخیره نهایی در دیتابیس ابری</span>';
            }
        }

        function logout() {
            sessionStorage.removeItem("duck_admin_token");
            location.reload();
        }
    </script>
</body>
</html>
