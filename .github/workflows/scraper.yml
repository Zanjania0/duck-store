name: Run Duck Scraper

on:
  schedule:
    # اجرا هر ۲ ساعت یک‌بار برای به‌روز نگه‌داشتن قیمت‌های فرگمنت و گیفت‌ها
    - cron: '0 */2 * * *'
  workflow_dispatch: # امکان اجرای دستی در هر لحظه با یک کلیک

# جلوگیری از اجرای تکراری و هدررفت منابع
concurrency:
  group: duck-scraper-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper & Price Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scraper.py

      - name: Commit and Push Changes Safely
        run: |
          git config --global user.name "DuckScraperBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html discounts.json discounts.csv
          
          # بررسی اینکه آیا تغییری برای ذخیره وجود دارد یا خیر
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update deals & fragment prices [skip ci]"
            # دریافت آخرین تغییرات قبل از push جهت جلوگیری از ارور تداخل
            git pull --rebase origin main
            git push origin main
          fi
