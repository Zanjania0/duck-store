name: Run Duck Scraper

on:
  schedule:
    # اجرای خودکار هر ۲ ساعت یک‌بار
    - cron: '0 */2 * * *'
  workflow_dispatch: # امکان اجرای دستی در هر لحظه با یک کلیک

concurrency:
  group: duck-scraper-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install httpx

      - name: Run Scraper & Price Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scraper.py

      - name: Commit and Push Changes Safely
        run: |
          git config --global user.name "DuckScraperBot"
          git config --global user.email "bot@users.noreply.github.com"
          
          git add index.html discounts.json discounts.csv || true
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update deals & gifts via MarketApp & SwapWallet API [skip ci]"
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull --rebase origin $BRANCH || true
            git push origin $BRANCH
          else
            echo "تغییری برای ثبت وجود ندارد."
          fi
